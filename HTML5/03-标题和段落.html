<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- 在 HTML 中，每个段落是通过 <p> 元素进行定义的，
        比如下面这样： -->

    <p>我是一个段落，千真万确。</p>

    <!-- 每个标题都必须被包裹在一个标题元素中： -->

    <h1>我是文章的标题</h1>

    <!-- 一共有六种标题元素标签——h1、h2、h3、h4、h5 和 h6。
     每个元素代表文档中不同级别的内容：
     <h1> 表示主标题，<h2> 表示二级子标题，<h3> 表示三级子标题，
    依此类推。 -->

    <h1>三国演义</h1>

    <p>罗贯中</p>

    <h2>第一回 宴桃园豪杰三结义 斩黄巾英雄首立功</h2>

    <p>
    话说天下大势，分久必合，合久必分。周末七国分争，并入于秦。及秦灭之后，楚、汉分争，又并入于汉……
    </p>

    <h2>第二回 张翼德怒鞭督邮 何国舅谋诛宦竖</h2>

    <p>
    且说董卓字仲颖，陇西临洮人也，官拜河东太守，自来骄傲。当日怠慢了玄德，张飞性发，便欲杀之……
    </p>

    <h3>却说张飞</h3>

    <p>
    却说张飞饮了数杯闷酒，乘马从馆驿前过，见五六十个老人，皆在门前痛哭。飞问其故，众老人答曰：“督邮逼勒县吏，欲害刘公；我等皆来苦告，不得放入，反遭把门人赶打！”……
    </p>
    
    <!-- 
        这是一个 <span> 元素，它没有语义
        对它使用了 CSS 来让它看起来像一个顶级标题
     -->
    <span style="font-size: 32px; margin: 21px 0; display: block;">
        这是顶级标题吗？
    </span>
    
</body>
</html>
