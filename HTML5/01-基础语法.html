<!-- 
 HTML（HyperText Markup Language，超文本标记语言）是一种标记语言

 HTML 中的标签不区分大小写。 这意味着它们可以用大写或小写书写。
 例如，<title> 标签可以写成 <title>、<TITLE>、<Title>、<TiTlE> 等，    并且都能正常工作。
    但是，为了保持一致性和可读性，最佳实践是所有标签都用小写书写

  -->

<!-- 
<!DOCTYPE> 声明表示文档类型，并帮助浏览器正确显示网页。
它只出现一次，在页面顶部（在任何HTML标记之前）。
<!DOCTYPE> 声明不区分大小写。
 -->
<!DOCTYPE html> <!-- HTML5 文档类型声明 -->
<html lang="en">    <!-- lang 属性声明了 HTML 文档的语言。 -->
<head>  <!-- <head> 标签包含了文档的元数据 -->
    <!-- 
     <meta> 标签提供有关 HTML 文档的元数据。
     元数据不会显示在页面上，但会被浏览器使用。

     如 <base>、<link>、<script>、<style> 或 <title> 表示的元数据

        charset 属性将你的文档的字符编码指定为 UTF-8，它包含了绝大多数人类书面语言的字符
        base 标签指定了所有相对 URL 的基准 URL。
        link 标签用于链接外部资源，例如样式表。
        style 标签用于定义内部样式表。
        script 标签用于定义客户端脚本，例如 JavaScript。
        title 标签定义了文档的标题。
     -->
    <meta charset="UTF-8">  
    <!-- 
    它设置了页面的标题，这个标题会出现在加载该页面的浏览器标签页中。
    当页面被收藏为书签时，页面标题也用于描述该页面。
     -->
    <title>Title</title> 
</head> <!-- </head> 标签结束了文档的元数据部分 -->
<body>  <!-- <body> 标签包含了文档的可见内容 -->

    <!-- 
    HTML 标题
    HTML 提供了六个级别的标题，分别是 <h1> 到 <h6>。
    <h1> 定义了最大的标题，<h6> 定义了最小的标题。
     -->
    <h1>这是标题 1</h1>
    <h2>这是标题 2</h2>
    <h3>这是标题 3</h3>
    <h4>这是标题 4</h4>
    <h5>这是标题 5</h5>
    <h6>这是标题 6</h6>

    <!-- 如果我们想让这段文本独立成段，我们可以用段落（<p>）元素来包裹它： -->
    <p> My cat is cute.</p>
    <p> 这是一个段落 </p>

    <!-- 
        em 标签用于定义强调文本
        这样做应该会使输出面板中渲染的文本变为斜体格式。
    -->
    <p> 这是 <em>强调</em> 文本 </p>
    <em> 这是强调文本 </em>

    <!-- 
        元素可以放置在其他元素内部。这被称为嵌套。
        如果我们想要表明我们的小猫脾气很暴躁，
        我们可以将很这个词用 <strong> 元素包裹起来，
        这意味着这个词将以粗体的文本格式显示
     -->
    <p>我们的小猫脾气<strong>很</strong>暴躁。</p>
    <p>这是一个<strong>粗体</strong>文本。</p>
    
    <!-- 
        空元素
    并非所有元素都遵循开始标签、内容和结束标签的模式。
    有些元素只包含一个标签，通常用于在文档中插入/嵌入某些东西。这类元素被称为空元素。
    例如，<img> 元素可以在页面上嵌入一个图像文件：
     -->
    <img src="https://raw.githubusercontent.com/mdn/beginner-html-site/gh-pages/images/firefox-icon.png" alt="Firefox 图标" />
    <p> </p>

    <!-- 
    属性包含关于元素的额外信息，这些信息不会出现在内容中

    一个属性应该有：
        一个在它和元素名之间的空格。
        （对于拥有多个属性的元素，属性之间也应该用空格分隔。）
        属性名，后跟一个等号。
        一个属性值，用开始和结束的引号包裹
    
    src：一个必需的属性，指定图像的位置。
    例如：src="https://raw.githubusercontent.com/mdn/beginner-html-site/gh-pages/images/firefox-icon.png"。
    alt：图像的文本描述。例如：alt="Firefox 图标"。
    width：图像的宽度，单位为像素。例如：width="300"。
    height：图像的高度，单位为像素。例如：height="300"
     -->
    
    <img 
    src="https://i1.hdslb.com/bfs/new_dyn/83d6b29ff85bb4d0f51c56af510555323546769371695776.png@1052w_!web-dynamic.webp" 
    alt="Miku"
    width="200" 
    height="200" />
    <p> </p>

    <!-- 
    布尔属性
    
    布尔属性是指只要存在就为 true 的属性。
    例如，<input> 元素的 disabled 属性是一个布尔属性。
    如果在 <input> 元素中包含 disabled 属性，则该元素将被禁用。
    如果不包含 disabled 属性，则该元素将被启用。
     -->
    <p> 这是一个禁用的文本框 </p>
    <input type="text" disabled>  <!-- 这是一个禁用的文本输入框 -->
    <p> 这是一个启用的文本框 </p>
    <input type="text">  <!-- 这是一个启用的文本输入框 -->
    <p> </p>
    
    <!-- 
    省略属性值周围的引号

    如果你查看许多其他网站的代码，
    你可能会遇到一些奇怪的标记样式，
    包括没有引号的属性值。
    这在某些情况下是允许的，但在其他情况下也可能破坏你的标记

    下面代码片段中的 <a> 元素被称为锚点。
        锚点包裹文本，并将其变成链接。href 属性指定了链接指向的网址。
        你可以只用 href 属性写出这个基本版本，像这样：
     -->
    <!-- HTML 链接是通过 <a> 标签来定义的。-->
    <p><a href="https://www.bilibili.com">B站链接</a></p>

    <p><a href="https://www.bilibili.com" 
        title= "哔哩哔哩">测试链接</a></p>

    <!-- 单引号和双引号都是有效的属性值引号 -->
    <p><a href='https://www.bilibili.com' title='哔哩哔哩'>单引号链接</a></p>
    <p><a href="https://www.bilibili.com" title="哔哩哔哩">双引号链接</a></p>
    
    <!-- 
    HTML 中的空白

    在上面的例子中，你可能注意到代码中包含了很多空白。
    这是可选的。这两个代码片段是等效的：
     -->
    <p id="noWhitespace">狗狗很 呆 萌。</p>
    <p id="whitespace">狗狗很
        呆
            萌。</p>


</body>
</html> <!-- HTML 文档以 <html> 开始，以 </html> 结束。 -->
